name: Windows Qt regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qt-msvc:
    name: Qt 6.8 / MSVC / CTest
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build-ci -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" -DBUILD_TESTING=ON

      - name: Build
        shell: pwsh
        run: cmake --build build-ci --config Release --parallel 2

      - name: CTest (print Qt test diagnostics)
        shell: pwsh
        run: |
          ctest --test-dir build-ci -C Release --output-on-failure
          $code = $LASTEXITCODE
          if (Test-Path "build-ci/runtime-tests.txt") {
            Get-Content "build-ci/runtime-tests.txt" | Select-Object -Last 450
          }
          exit $code

      - name: Capture 21 palette components
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:QT_QUICK_CONTROLS_STYLE = "Fusion"
          $env:QT_PLUGIN_PATH = Join-Path $env:QT_ROOT_DIR "plugins"
          $env:QML_IMPORT_PATH = Join-Path $env:QT_ROOT_DIR "qml"
          $env:QT_QPA_FONTDIR = Join-Path $env:WINDIR "Fonts"
          $env:MUTYVA_PALETTE_CAPTURE_DIR = Join-Path $env:GITHUB_WORKSPACE "palette-captures"
          & ".\\build-ci\\Release\\runtime-tests.exe" paletteCaptureScreenshots -o -,txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $images = @(Get-ChildItem $env:MUTYVA_PALETTE_CAPTURE_DIR -Filter "*.png")
          if ($images.Count -ne 21) { throw "Expected 21 component PNGs; got $($images.Count)" }

      - name: Publish real Qt screenshots
        uses: actions/upload-artifact@v4
        with:
          name: mutyva-component-gallery
          path: palette-captures/*.png
          if-no-files-found: error
          retention-days: 90
