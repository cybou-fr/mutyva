name: Windows Qt regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qt-msvc:
    name: Qt 6.8 / MSVC / CTest
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build-ci -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" -DBUILD_TESTING=ON

      - name: Build
        shell: pwsh
        run: cmake --build build-ci --config Release --parallel 2

      - name: CTest
        shell: pwsh
        run: ctest --test-dir build-ci -C Release --output-on-failure
