name: Windows Qt regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qt-msvc:
    name: Qt 6.12 / MSVC / CTest
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      # Qt 6.12 MSVC packages are distributed via Qt Online Installer.
      # GitHub Actions secrets must contain a Qt Account login; never print them.
      - name: Check Qt Account secrets
        shell: pwsh
        env:
          QT_EMAIL: ${{ secrets.QT_EMAIL }}
          QT_PW: ${{ secrets.QT_PW }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:QT_EMAIL) -or [string]::IsNullOrWhiteSpace($env:QT_PW)) {
            throw "Qt 6.12 CI requires QT_EMAIL and QT_PW in GitHub Actions secrets. No Qt 6.8 fallback is allowed."
          }

      - name: Install Qt 6.12
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          arch: win64_msvc2022_64
          use-official: true
          email: ${{ secrets.QT_EMAIL }}
          pw: ${{ secrets.QT_PW }}
          cache: true

      # Identical native acceptance for a local Qt 6.12 kit and GitHub Actions.
      - name: Qt 6.12 native acceptance (configure, build, CTest, 21 screenshots)
        shell: pwsh
        run: ./tools/verify-qt612.ps1 -QtRoot "$env:QT_ROOT_DIR" -BuildDir build-ci -CaptureDir palette-captures -EvidenceDir qt612-evidence

      - name: Publish real Qt screenshots
        uses: actions/upload-artifact@v4
        with:
          name: mutyva-component-gallery
          path: palette-captures/*.png
          if-no-files-found: error
          retention-days: 90

      - name: Publish Qt 6.12 acceptance report
        uses: actions/upload-artifact@v4
        with:
          name: mutyva-qt612-acceptance
          path: qt612-evidence/qt612-acceptance.json
          if-no-files-found: error
          retention-days: 90
